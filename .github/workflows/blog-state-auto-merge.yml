name: Blog state auto-merge

# Blog automation routine (원격 sandbox)이 push한 상태 브랜치를
# main에 fast-forward 머지한다.
#
# 2026-07-15 근본 진단: 샌드박스 GitHub 프록시는 push를 "세션의 현재 작업 브랜치"로만
# 허용한다 — 세션 도중 새로 만든 claude/state-* 브랜치는 403. 그래서 routine은 이제
# 현재 작업 브랜치(이름을 미리 알 수 없음)에 커밋해 push하고, 이 워크플로우가
# claude/** 전체를 받아서 "상태 파일만 변경된 브랜치"인지 검사 후 머지한다.
# 상태 파일 외 경로를 건드린 브랜치(일반 클라우드 세션 작업 브랜치)는 조용히 스킵.
# 브랜치 삭제는 claude/state-* 이름일 때만 (일반 세션 브랜치를 지우면 안 되므로).

on:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: blog-state-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward main to state branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH"

          CHANGED=$(git diff --name-only origin/main..."origin/$BRANCH")
          if [ -z "$CHANGED" ]; then
            if [[ "$BRANCH" == claude/state-* ]]; then
              echo "No changes on $BRANCH vs main — deleting stale state branch."
              git push origin --delete "$BRANCH"
            else
              echo "No changes on $BRANCH vs main — not a state branch, leaving it alone."
            fi
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qEv '^tools/blog-automation/(state|published)/' ; then
            if [[ "$BRANCH" == claude/state-* ]]; then
              echo "::error::$BRANCH is a state branch but modifies files outside tools/blog-automation/{state,published}/ — refusing to merge."
              exit 1
            fi
            echo "$BRANCH modifies non-state paths — normal session branch, skipping."
            exit 0
          fi

          if git merge-base --is-ancestor origin/main "origin/$BRANCH" ; then
            git merge --ff-only "origin/$BRANCH"
            git push origin main
            echo "Fast-forwarded main to $BRANCH."
            if [[ "$BRANCH" == claude/state-* ]]; then
              git push origin --delete "$BRANCH"
              echo "Deleted state branch $BRANCH."
            fi
          else
            echo "::error::$BRANCH is not a fast-forward of main. Manual review needed."
            exit 1
          fi
