name: Scene script auto-merge

# 영상 대본 루틴(원격 sandbox)이 push한 대본 브랜치를 main에 fast-forward 머지한다.
#
# 왜 필요한가: 영상 파이프라인은 반씩 나뉘어 있다.
#   - 대본 절반(기획→작성→검수→마스터)은 Claude 만 있으면 되므로 **클라우드**에서 돈다.
#     PC 가 꺼져 있어도 대본이 쌓인다.
#   - 렌더 절반(음성 645MB 모델 · 크로미움 · ffmpeg)은 **로컬 PC** 여야 한다.
#     로컬은 로그온/격일 트리거로 깨어나 밀린 대본을 렌더한다.
# 그 사이를 잇는 게 이 워크플로우다.
#
# blog-state-auto-merge.yml 과 같은 구조이고 받는 경로만 다르다.
# 그쪽은 tools/blog-automation/{state,published}/ 만 받으므로 씬 파일은 조용히 건너뛴다.
#
# 🔴 build/ 는 .gitignore 라 애초에 안 올라온다(mp4·wav 를 리포에 넣지 않는다).
#    혹시 올라오면 아래 검사가 막는다 — 경로를 episodes/**/{scene.json,kinds,notes} 로 좁혔다.
#
# 🔑 **브랜치 이름으로는 아무것도 판단하지 않는다.** 클라우드 루틴은 자기 브랜치 이름을
#    짓지 않고 Claude Code 가 자동으로 짓는다(`claude/busy-brahmagupta-bzbs7e`). 트리거가
#    `claude/**` 인 것도 그래서다. 판정은 전부 **바뀐 경로**로 한다 — 자세한 이유는 아래
#    CARRIES_SCRIPT 주석에.

on:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: scene-script-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward main to script branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH"

          CHANGED=$(git diff --name-only origin/main..."origin/$BRANCH")
          if [ -z "$CHANGED" ]; then
            # 브랜치가 main 에 더할 게 없다. 여기서는 지우지 않는다 —
            # 무엇이 대본 브랜치였는지 알 방법이 diff 뿐인데 그 diff 가 비어 있다.
            # 이름으로 찍으면 틀린다(아래 참조). 우리가 머지한 브랜치만 우리가 지운다.
            echo "No changes on $BRANCH vs main — nothing to do."
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # 대본 산출물만 받는다. scene.json · kinds/*.js · notes/*.md
          # + state/schedule.json — 순서표가 바닥나면 클라우드 루틴이 backlog.mjs --extend 로
          #   새 블로그 글을 회차로 편입한다(2026-08-02, 격일→매일 전환과 함께). 그 줄이
          #   여기로 안 들어오면 다음 실행이 같은 판정을 되풀이하고 회차가 영영 안 늘어난다.
          ALLOW='^tools/scene-video/(episodes/[^/]+/(scene\.json|kinds/.+\.js|notes/.+)|state/schedule\.json)$'

          # 🔴 "대본 브랜치인가"를 **이름으로 묻지 않는다** (2026-08-05 수정).
          #
          # 옛 코드는 `claude/scene-*` 를 가정했다. 그런데 클라우드 루틴은 자기 브랜치
          # 이름을 짓지 않는다 — Claude Code 가 `claude/busy-brahmagupta-bzbs7e` 처럼
          # 자동으로 짓는다. 그래서 이 가정은 **한 번도 참인 적이 없었고**, 이름에 매달린
          # 세 갈래(다 쓴 브랜치 삭제 · 경로 위반 엄격 정지 · 머지 후 삭제)가 전부
          # 죽은 코드였다. 머지 자체는 `claude/**` 트리거라 돌았기 때문에 아무도 몰랐다.
          #
          # 이름 대신 **내용**으로 묻는다: 이 브랜치가 scene.json 을 건드리는가.
          # 대본을 실어 나르는 브랜치는 반드시 그것을 건드린다.
          CARRIES_SCRIPT=no
          if echo "$CHANGED" | grep -qE '^tools/scene-video/episodes/[^/]+/scene\.json$' ; then
            CARRIES_SCRIPT=yes
          fi

          if echo "$CHANGED" | grep -qEv "$ALLOW" ; then
            if [ "$CARRIES_SCRIPT" = yes ]; then
              # 대본과 다른 것이 한 브랜치에 섞였다. 받으면 대본 아닌 것까지 main 에
              # 밀어넣게 되므로 안 받는다. 그런데 **조용히 넘기면 안 된다** — 이 갈래가
              # 조용했기 때문에 2026-08-05 에 하루치 대본을 잃었다. 실행을 red 로
              # 만들지는 않는다(대본을 곁들여 고친 평범한 세션 브랜치도 여기로 온다).
              echo "::warning::$BRANCH carries a scene.json AND non-script changes — not merging. The script will NOT reach main from here; merge this branch by hand."
              echo "Non-script paths on this branch:"
              echo "$CHANGED" | grep -Ev "$ALLOW"
              exit 0
            fi
            echo "$BRANCH modifies non-script paths and carries no script — normal session branch, skipping."
            exit 0
          fi

          if git merge-base --is-ancestor origin/main "origin/$BRANCH" ; then
            git merge --ff-only "origin/$BRANCH"
            echo "Fast-forwarded main to $BRANCH."
          else
            # 🔴 main 이 대본을 쓰는 사이 전진했다. 이건 사고가 아니라 **평상시**다 —
            #    로컬 세션이 게임 코드를 main 에 올리는 날마다 반드시 이 갈래로 온다.
            #    옛 코드는 여기서 --ff-only 하나만 보고 exit 1 했고, 2026-08-05 에
            #    ep06s 대본이 31커밋 차이로 거부되어 그날 영상이 통째로 안 나왔다.
            #    클라우드는 실패를 모르므로 다음 날 다음 회차를 쓰고, 버려진 대본은
            #    아무도 안 보는 브랜치에 영원히 남는다. 조용히 잃는 구조였다.
            #
            #    위 ALLOW 검사가 "이 브랜치는 대본 파일만 건드린다"를 이미 증명했으니
            #    그 커밋을 main 위로 옮겨 붙이는 것은 안전하다. 충돌하면 그때 멈춘다.
            BASE=$(git merge-base origin/main "origin/$BRANCH")
            echo "main moved on since $BASE - replaying script commits onto main."
            git checkout -B _replay "origin/$BRANCH"
            if ! git rebase --onto main "$BASE" ; then
              git rebase --abort || true
              git checkout main
              echo "::error::Replaying $BRANCH onto main hit a conflict. Manual review needed."
              exit 1
            fi

            # 옮겨 붙인 결과를 다시 검사한다. 위 ALLOW 는 rebase 이전의 브랜치를 본 것이라
            # 여기서 한 번 더 봐야 "대본만 받는다"는 약속이 실제로 지켜진다.
            REPLAYED=$(git diff --name-only main.._replay)
            if [ -z "$REPLAYED" ]; then
              git checkout main
              echo "Nothing left after replay - main already has these changes."
              exit 0
            fi
            if echo "$REPLAYED" | grep -qEv "$ALLOW" ; then
              git checkout main
              echo "::error::Replayed commits touch non-script paths - refusing. Manual review needed."
              exit 1
            fi

            git checkout main
            git merge --ff-only _replay
            echo "Replayed $BRANCH onto main."
          fi

          git push origin main

          # 여기까지 왔다는 것은 이 브랜치가 대본 파일만 건드렸고 그게 지금 main 에
          # 들어갔다는 뜻이다. 내용이 증명한 사실이므로 이름을 볼 필요가 없다.
          # 🔑 우리가 머지한 브랜치만 우리가 지운다 — 스스로 머지하지 않은 남의
          #    세션 브랜치를 지우면 거기 걸린 PR 이 함께 닫힌다.
          git push origin --delete "$BRANCH"
          echo "Deleted $BRANCH — its script is now on main."
