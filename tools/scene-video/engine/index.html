<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장면 렌더러 · scene-video</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage">
  <!-- 상시 노출 브랜딩 : 어느 지점에서 이탈해도 이건 남는다 -->
  <header class="hud">
    <h1 class="ep" id="hudTitle"></h1>
    <div class="airow">
      <p class="ai" id="hudAi"><span class="mark">⌘</span><span id="hudAiText"></span></p>
      <span class="outro" id="hudOutro"></span>
    </div>
    <div class="progline">
      <div class="prog"><i id="prog"></i></div>
      <span class="chip" id="chip"></span>
    </div>
  </header>

  <main class="vis" id="vis"></main>

  <div class="capveil"></div>
  <footer class="cap"><p id="cap"></p></footer>
</div>

<div class="bar">
  <button id="play">재생</button>
  <button class="ghost" id="speed">×1</button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span class="time" id="time">0.0s</span>
</div>
<p class="hint" id="hint"></p>

<script type="module" src="engine.js"></script>
</body>
</html>
